name: Frontend Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: frontend / Node.js 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: frontend

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm run test

      - name: Run lint
        working-directory: frontend
        run: pnpm run lint

      - name: Run typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
