name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
          - build-windows
      version:
        description: Existing X.Y.Z version to rebuild (only for build-windows)
        required: false
        type: string

  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: offerpilot-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  create_release_pr:
    name: Create Release PR
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'bump-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate source branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Version bump workflows must be dispatched from main (got $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate and update version
        id: version
        shell: bash
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./electron/package.json').version")"
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Current application version must be X.Y.Z, got $current_version."
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          case "$RELEASE_ACTION" in
            bump-major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            bump-minor)
              minor=$((minor + 1))
              patch=0
              ;;
            bump-patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "::error::Unsupported release action: $RELEASE_ACTION"
              exit 1
              ;;
          esac

          new_version="${major}.${minor}.${patch}"

          for directory in . frontend electron; do
            (
              cd "$directory"
              npm version "$new_version" --no-git-tag-version --ignore-scripts
            )
          done

          RELEASE_VERSION="$new_version" node <<'NODE'
          const fs = require('node:fs');

          const file = 'frontend/app/lib/i18n.ts';
          const version = process.env.RELEASE_VERSION;
          const source = fs.readFileSync(file, 'utf8');
          const pattern = /OfferPilot v\d+\.\d+\.\d+/g;
          const matches = source.match(pattern) ?? [];

          if (matches.length !== 2) {
            throw new Error(`Expected two UI version strings in ${file}, found ${matches.length}.`);
          }

          fs.writeFileSync(file, source.replace(pattern, `OfferPilot v${version}`));
          NODE

          RELEASE_VERSION="$new_version" node <<'NODE'
          const fs = require('node:fs');

          const expected = process.env.RELEASE_VERSION;
          const packageFiles = [
            'package.json',
            'frontend/package.json',
            'electron/package.json',
          ];
          const lockFiles = [
            'package-lock.json',
            'frontend/package-lock.json',
            'electron/package-lock.json',
          ];

          for (const file of packageFiles) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (packageJson.version !== expected) {
              throw new Error(`${file} has version ${packageJson.version}, expected ${expected}.`);
            }
          }

          for (const file of lockFiles) {
            const lockfile = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rootVersion = lockfile.packages?.['']?.version;
            if (lockfile.version !== expected || rootVersion !== expected) {
              throw new Error(`${file} is not synchronized to ${expected}.`);
            }
          }
          NODE

          git diff --check
          printf 'version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$new_version" >> "$GITHUB_OUTPUT"

      - name: Create Release PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: release/v${{ steps.version.outputs.version }}
          commit-message: "chore(release): prepare v${{ steps.version.outputs.version }}"
          title: "release: v${{ steps.version.outputs.version }}"
          body: |
            Prepares OfferPilot v${{ steps.version.outputs.version }}.

            Updated application version metadata in the root project, frontend,
            Electron shell, and sidebar translations. After this PR is merged
            into `main`, the release workflow will create the immutable tag,
            build the Windows x64 installer, and publish the GitHub Release.

  publish_tag:
    name: Tag Merged Release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Validate merge commit
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [[ -z "$MERGE_SHA" ]]; then
            echo "::error::The merged release PR has no merge commit SHA."
            exit 1
          fi

      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version and create tag
        id: release
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]]; then
            echo "::error::The checkout does not match the PR merge commit."
            exit 1
          fi

          version="$(node -p "require('./electron/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be X.Y.Z, got $version."
            exit 1
          fi

          for file in package.json frontend/package.json electron/package.json; do
            file_version="$(node -p "require('./$file').version")"
            if [[ "$file_version" != "$version" ]]; then
              echo "::error::$file has version $file_version, expected $version."
              exit 1
            fi
          done

          if [[ "$HEAD_REF" != "release/v$version" ]]; then
            echo "::error::Release PR branch $HEAD_REF does not match release/v$version."
            exit 1
          fi

          EXPECTED_VERSION="$version" node <<'NODE'
          const fs = require('node:fs');

          const expected = process.env.EXPECTED_VERSION;
          for (const file of [
            'package-lock.json',
            'frontend/package-lock.json',
            'electron/package-lock.json',
          ]) {
            const lockfile = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (lockfile.version !== expected || lockfile.packages?.['']?.version !== expected) {
              throw new Error(`${file} is not synchronized to ${expected}.`);
            }
          }
          NODE

          tag="v$version"
          if git show-ref --tags --verify --quiet "refs/tags/$tag" || \
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; refusing to move or overwrite it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$MERGE_SHA" --message "Release $tag"
          git push origin "$tag"

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows x64 installer
    needs:
      - publish_tag
    if: >-
      always() &&
      (
        needs.publish_tag.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'build-windows')
      )
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.publish_tag.outputs.version || inputs.version }}
      RELEASE_TAG: ${{ needs.publish_tag.outputs.tag || format('v{0}', inputs.version) }}

    steps:
      - name: Validate manual build input
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:ACTION -ne 'build-windows') {
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            throw "The version input is required for build-windows."
          }

          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version must use X.Y.Z without a leading v."
          }

          $tag = "v$env:VERSION"
          gh api "repos/$env:REPOSITORY/git/ref/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag does not exist; refusing to build an untagged version."
          }

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install Python
        working-directory: backend
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Build Windows installer
        working-directory: electron
        run: npm run build:win -- --publish never

      - name: Collect installer
        id: artifact
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "electron/release/$env:RELEASE_VERSION"
          $installer = Get-ChildItem -LiteralPath $releaseDirectory -Recurse -Filter '*Setup.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "No Windows setup installer was found under $releaseDirectory."
          }

          $assetName = "OfferPilot-Windows-x64-$env:RELEASE_TAG.exe"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          Copy-Item -LiteralPath $installer.FullName -Destination $assetPath -Force

          "path=$assetPath" >> $env:GITHUB_OUTPUT
          "name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          gh release view $env:TAG --repo $env:REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG `
              --repo $env:REPOSITORY `
              --title $env:TAG `
              --verify-tag `
              --generate-notes

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release $env:TAG."
            }
          }

          gh release upload $env:TAG $env:ASSET_PATH `
            --repo $env:REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the Windows installer to GitHub Release $env:TAG."
          }
