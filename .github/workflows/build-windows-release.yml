name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
          - build-windows
          - build-linux
          - build-all
      version:
        description: Existing X.Y.Z tag to rebuild (required for build actions)
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offerpilot-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  create_release_pr:
    name: Create Release PR
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'bump-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Version bumps must be dispatched from main.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update application version
        id: version
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          version="$(node electron/scripts/release-version.mjs bump "$RELEASE_ACTION")"
          git diff --check
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: release/v${{ steps.version.outputs.version }}
          commit-message: "chore(release): prepare v${{ steps.version.outputs.version }}"
          title: "release: v${{ steps.version.outputs.version }}"
          body: |
            Prepares OfferPilot v${{ steps.version.outputs.version }}.

            Synchronizes application versions and both sidebar translations.
            Merging into main creates the immutable tag, builds Windows x64
            and Linux x64 installers, verifies Linux on Ubuntu 22.04 and 24.04,
            and publishes the complete GitHub Release after all checks pass.

  resolve_release:
    name: Resolve immutable release source
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'build-')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      platforms: ${{ steps.release.outputs.platforms }}
    steps:
      - name: Validate manual tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::A build action requires X.Y.Z without a leading v.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$REQUESTED_VERSION" > /dev/null
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version and resolve tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_ACTION: ${{ inputs.action || 'automatic' }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f electron/scripts/release-version.mjs ]]; then
            echo '::error::This tag predates the pnpm release tooling. Prepare a new release; existing tags will not be changed.'
            exit 1
          fi
          version="$(node electron/scripts/release-version.mjs check "$REQUESTED_VERSION")"
          tag="v$version"
          platforms="$(node electron/scripts/release-policy.mjs platforms "$RELEASE_ACTION")"
          node electron/scripts/release-version.mjs support "$platforms"
          if [[ "$RELEASE_ACTION" == automatic ]]; then
            if [[ -z "$MERGE_SHA" || "$(git rev-parse HEAD)" != "$MERGE_SHA" || "$HEAD_REF" != "release/$tag" ]]; then
              echo '::error::The release branch/version must match the checked-out merge commit.'
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              if [[ "$(git rev-parse "$tag^{commit}")" != "$MERGE_SHA" ]]; then
                echo '::error::The existing tag points elsewhere; refusing to overwrite it.'
                exit 1
              fi
            else
              git config user.name 'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git tag --annotate "$tag" "$MERGE_SHA" --message "Release $tag"
              git push origin "$tag"
            fi
          fi
          printf 'version=%s\ntag=%s\nplatforms=%s\n' "$version" "$tag" "$platforms" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows x64
    needs: resolve_release
    if: contains(needs.resolve_release.outputs.platforms, 'windows')
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            electron/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
        working-directory: backend
      - run: uv sync --frozen --all-groups --python 3.13
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - run: pnpm run test
        working-directory: electron
      - run: pnpm run lint
        working-directory: electron
      - run: pnpm run build:win
        working-directory: electron
      - run: node electron/scripts/collect-release.mjs windows "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: electron/release/${{ env.RELEASE_VERSION }}/assets/windows/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-partial-build-assets
          path: electron/release/${{ env.RELEASE_VERSION }}/*Setup.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-logs
          path: |
            electron/resources/backend-build/build/**/warn-*.txt
            electron/release/**/builder-debug.yml
            electron/release/**/builder-effective-config.yaml
          retention-days: 14

  build_linux:
    name: Build Linux x64 on Ubuntu 22.04
    needs: resolve_release
    if: contains(needs.resolve_release.outputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            electron/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libgl1 libfontconfig1 libharfbuzz0b fonts-dejavu-core fonts-noto-cjk
      - run: uv python install 3.13
        working-directory: backend
      - run: uv sync --frozen --all-groups --python 3.13
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run typecheck
      - run: pnpm run test
        working-directory: electron
      - run: pnpm run lint
        working-directory: electron
      - run: pnpm run build:linux
        working-directory: electron
      - run: node electron/scripts/collect-release.mjs linux "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: electron/release/${{ env.RELEASE_VERSION }}/assets/linux/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-partial-build-assets
          path: |
            electron/release/${{ env.RELEASE_VERSION }}/*.AppImage
            electron/release/${{ env.RELEASE_VERSION }}/*.deb
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-logs
          path: |
            electron/resources/backend-build/build/**/warn-*.txt
            electron/release/**/builder-debug.yml
            electron/release/**/builder-effective-config.yaml
          retention-days: 14

  verify_linux:
    name: Verify Linux / ${{ matrix.os }}
    needs: [resolve_release, build_linux]
    if: contains(needs.resolve_release.outputs.platforms, 'linux')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release-assets
      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check "OfferPilot-Linux-x64-v$RELEASE_VERSION.sha256"
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 libgl1 libfontconfig1 libharfbuzz0b fonts-dejavu-core fonts-noto-cjk
      - name: Install deb
        id: install_deb
        run: sudo apt-get install -y "./release-assets/OfferPilot-Linux-x64-v$RELEASE_VERSION.deb"
      - name: Verify installed deb and frozen backend
        working-directory: electron
        run: >-
          xvfb-run -a pnpm run test:linux
          --executable /opt/OfferPilot/offerpilot
          --resources /opt/OfferPilot/resources
          --output "$RUNNER_TEMP/deb-evidence"
      - name: Verify deb uninstall
        if: always() && steps.install_deb.outcome == 'success'
        run: |
          sudo apt-get remove -y offerpilot
          test ! -e /opt/OfferPilot/offerpilot
          if [[ -f "$RUNNER_TEMP/deb-evidence/result.json" ]]; then
            node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import path from 'node:path';
          const result = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'deb-evidence/result.json')));
          assert.ok(existsSync(path.join(result.runtime, 'config.yaml')), 'Uninstall removed runtime data');
          NODE
          fi
      - name: Extract AppImage for resource verification
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          chmod +x "release-assets/OfferPilot-Linux-x64-v$RELEASE_VERSION.AppImage"
          cd "$RUNNER_TEMP/appimage"
          "$GITHUB_WORKSPACE/release-assets/OfferPilot-Linux-x64-v$RELEASE_VERSION.AppImage" --appimage-extract > /dev/null
      - name: Verify AppImage launch and frozen backend
        working-directory: electron
        run: >-
          xvfb-run -a pnpm run test:linux
          --executable "$GITHUB_WORKSPACE/release-assets/OfferPilot-Linux-x64-v$RELEASE_VERSION.AppImage"
          --resources "$RUNNER_TEMP/appimage/squashfs-root/resources"
          --output "$RUNNER_TEMP/appimage-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/deb-evidence
            ${{ runner.temp }}/appimage-evidence
          retention-days: 14

  publish_release:
    name: Publish verified installers
    needs: [resolve_release, build_windows, build_linux, verify_linux]
    if: always() && needs.resolve_release.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: offerpilot-publish-${{ needs.resolve_release.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.resolve_release.outputs.version }}
      RELEASE_PLATFORMS: ${{ needs.resolve_release.outputs.platforms }}
      WINDOWS_RESULT: ${{ needs.build_windows.result }}
      LINUX_RESULT: ${{ needs.build_linux.result }}
      VERIFY_LINUX_RESULT: ${{ needs.verify_linux.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce publication gate
        run: node electron/scripts/release-policy.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          merge-multiple: true
          path: release-assets
      - name: Publish complete release or replace selected assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node electron/scripts/publish-release.mjs
