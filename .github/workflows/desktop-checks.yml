name: Desktop packaging checks

on:
  pull_request:
    paths:
      - electron/**
      - backend/packaging/**
      - backend/scripts/**
      - .github/workflows/*release*
      - .github/workflows/desktop-checks.yml
      - package.json
      - frontend/package.json
      - frontend/app/lib/i18n.ts

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - run: node electron/scripts/release-version.mjs check
      - run: pnpm run test
        working-directory: electron
      - run: pnpm run lint
        working-directory: electron
      - run: pnpm run build:electron
        working-directory: electron
