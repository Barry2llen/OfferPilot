database:
  type: "sqlite"
  path: "./data/offer_pilot.db"
  echo: false

resume_upload_dir: "./data/resumes"
chat_file_upload_dir: "./data/chat_files"

graph_recursion_limit: 100

context_compaction:
  enabled: true
  default_max_context_tokens: 128000
  reserved_output_tokens: 20000
  safety_margin_tokens: 10000
  keep_recent_turns: 4
  tool_result_max_characters: 6000
  compact_historical_attachments: true
  model_context_windows: {}

cors:
  allow_origins:
    - "*"
  allow_credentials: false
  allow_methods:
    - "*"
  allow_headers:
    - "*"

exa_api_key: "your_exa_api_key_here"

